<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../public/css/cadastro.css">
    <link rel="shortcut icon" href="../public/assets/logo90.png" type="image/x-icon">
    <title>Cadastre-se</title>
</head>
<body>
    <div class="principal">

        <div class="esquerda">
            <div class="esquerda-titulo">
                <h1>Qual história o futebol <span>escreveu em você?</span></h1>
            </div>
            <div class="esquerda-conteudo">
                <p>
                    Crie sua conta e compartilhe sua experiência. Sua
                    resposta ajuda a construir um retrato vivo de como
                    o futebol transforma a vida das pessoas dentro e fora
                    de campo.
                </p>
            </div>
        </div>

        <div class="direita">
            <div class="direita-conteudo">
                <h1>Cadastre-se</h1>
                <p>Leva menos de um minuto.</p>

                <!-- troque o action pelo endereço do seu back-end -->
                <form action="#" method="post">
                    <label for="ipt_nome">Nome completo</label>
                    <input type="text" id="ipt_nome" name="nome" placeholder="Digite seu nome" required />

                    <label for="ipt_email">E-mail</label>
                    <input type="email" id="ipt_email" name="email" placeholder="seu-email@provedor.com" required />

                    <label for="ipt_senha">Crie uma senha</label>
                    <input type="password" id="ipt_senha" name="senha" placeholder="Mínimo de 6 caracteres" minlength="6" required />

                    <label for="ipt_confirmar">Confirme sua senha</label>
                    <input type="password" id="ipt_confirmar" name="confirmar" placeholder="Confirme sua senha" required />

                    <button type="submit" class="botao-cadastro">Criar conta</button>
                </form>

                <p class="troca">
                    Já tem conta? <a href="../public/login.html">Fazer login</a>
                </p>
            </div>
        </div>

    </div>
</body>
</html>
