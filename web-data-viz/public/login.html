<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Entrar</title>

    <script src="js/sessao.js"></script>

    <link rel="stylesheet" href="css/login.css" />
    <link rel="shortcut icon" href="assets/logo90.png" type="image/x-icon" />
  </head>
  <body>
    <div class="principal">
      <div class="esquerda">
        <div class="voltar">
          <a href="index.html">
            <button>⭠</button>
          </a>
        </div>
        <div class="esquerda-titulo">
          <h1>Que bom ter você <span>de volta.</span></h1>
        </div>
        <div class="esquerda-conteudo">
          <p>
            Entre na sua conta para continuar compartilhando a história que o
            futebol escreveu em você.
          </p>
        </div>
      </div>

      <div class="direita">
        <div class="direita-conteudo">
          <h1>Entrar</h1>
          <p>Use o e-mail e a senha do seu cadastro.</p>

          <div class="alerta_erro">
            <div class="card_erro" id="cardErro" style="display: none">
              <span id="mensagem_erro"></span>
            </div>
          </div>

          <label for="email_input">E-mail</label>
          <input
            type="email"
            id="email_input"
            name="email"
            placeholder="seu-email@provedor.com"
          />

          <label for="senha_input">Senha</label>
          <input
            type="password"
            id="senha_input"
            name="senha"
            placeholder="Sua senha"
          />

          <button type="button" class="botao-cadastro" onclick="entrar()">
            Entrar
          </button>

          <div id="div_aguardar" class="loading-div" style="display: none">
            <img src="assets/circle-loading.gif" id="loading-gif" />
          </div>

          <div id="div_erros_login"></div>

          <p class="troca">
            Não tem uma conta? <a href="cadastro.html">Crie uma.</a>
          </p>
        </div>
      </div>
    </div>

    <script>
      function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
          cardErro.style.display = "block";
          mensagem_erro.innerHTML = "Preencha o e-mail e a senha.";
          finalizarAguardar();
          setTimeout(sumirMensagem, 5000);
          return false;
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            emailServer: emailVar,
            senhaServer: senhaVar,
          }),
        })
          .then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!");

            if (resposta.ok) {
              console.log(resposta);

              resposta.json().then((json) => {
                console.log(json);
                console.log(JSON.stringify(json));
                sessionStorage.EMAIL_USUARIO = json.email;
                sessionStorage.NOME_USUARIO = json.nome;
                sessionStorage.ID_USUARIO = json.id;
                sessionStorage.AQUARIOS = JSON.stringify(json.aquarios);

                setTimeout(function () {
                  window.location = "dashboard/dashboard.html";
                }, 1000); // apenas para exibir o loading
              });
            } else {
              console.log("Houve um erro ao tentar realizar o login!");

              resposta.text().then((texto) => {
                console.error(texto);
                finalizarAguardar(texto);
              });
            }
          })
          .catch(function (erro) {
            console.log(erro);
            finalizarAguardar();
          });

        return false;
      }

      function sumirMensagem() {
        cardErro.style.display = "none";
      }
    </script>
  </body>
</html>
