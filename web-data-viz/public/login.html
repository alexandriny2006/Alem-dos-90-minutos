<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../public/css/login.css" />
    <link rel="shortcut icon" href="../public/assets/logo90.png"type="image/x-icon"/>
    <title>Entrar</title>
  </head>
  <body>
    <div class="principal">
      <div class="esquerda">
        <div class="esquerda-titulo">
          <h1>Que bom ter você <span>de volta.</span></h1>
        </div>
        <div class="esquerda-conteudo">
          <p>
            Entre na sua conta para continuar compartilhando a história que o
            futebol escreveu em você.
          </p>
        </div>
      </div>

      <div class="direita">
        <div class="direita-conteudo">
          <h1>Entrar</h1>
          <p>Use o e-mail e a senha do seu cadastro.</p>

            <label for="ipt_email">E-mail</label>
            <input type="email" id="ipt_email" name="email" placeholder="seu-email@provedor.com"/>

            <label for="ipt_senha">Senha</label>
            <input type="password" id="ipt_senha" name="senha" placeholder="Sua senha"/>

            <button type="submit" class="botao-cadastro">Entrar</button>


          <p class="troca">
            Não tem uma conta? <a href="../public/cadastro.html">Crie uma.</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
